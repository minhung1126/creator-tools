name: Validate container

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - frontend/**
      - pyproject.toml
      - docker-compose.yml
      - .env.example
      - .github/workflows/validate-container.yml

permissions:
  contents: read

concurrency:
  group: validate-container-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies and test tools
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend
        run: |
          python -m ruff format --check backend
          python -m ruff check backend
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

      - name: Validate Docker and Compose
        run: |
          cp .env.example .env
          docker build --build-arg APP_COMMIT_SHA=audit -t creator-tools:audit .
          docker compose config
