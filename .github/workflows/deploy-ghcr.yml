name: Validate container build

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - backend/**
      - frontend/**
      - .github/workflows/deploy-ghcr.yml
      - .github/workflows/publish-container.yml

permissions:
  contents: read

concurrency:
  group: validate-container-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          build-args: |
            APP_COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=container-build
          cache-to: type=gha,mode=max,scope=container-build
