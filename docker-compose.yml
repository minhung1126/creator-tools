services:
  creator-tools:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
    image: creator-tools:local
    container_name: creator_tools
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
